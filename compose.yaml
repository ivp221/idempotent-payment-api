
services:
  mysql:
    image: mysql:8.4
    container_name: payment-mysql
    environment:
      MYSQL_DATABASE: {YOUR_DATABASE_NAME}
      MYSQL_USER: {YOUR_USERNAME}
      MYSQL_PASSWORD: {YOUR_PASSWORD}
      MYSQL_ROOT_PASSWORD: {YOUR_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

